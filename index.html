
<!doctype html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1769aa">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <title>BayadBuddy PH</title>
  <style>
   
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch((error) => {
        console.error("Service worker registration failed:", error);
      });
  });
}
</script>
 body {
      font-family: Arial, sans-serif;
      background: #f2f7fa;
      color: #123b5d;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 500px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 16px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      border-radius: 10px;
      border: 1px solid #ccd8e0;
      font-size: 16px;
    }
    button {
      background: #22a699;
      color: white;
      border: 0;
      font-weight: bold;
    }
    li { margin: 12px 0; overflow-wrap: anywhere; }
    .amount { font-weight: bold; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>💙 BayadBuddy PH</h1>
    <p>Track your bills and due dates.</p>
    <h2>Total unpaid: <span id="total">₱0.00</span></h2>
  </div>

  <div class="card">
    <h2>➕ Add a bill</h2>
    <form id="form">
      <input id="name" placeholder="Bill name" required>
      <input id="amount" type="number" min="0.01"
        step="0.01" placeholder="Amount in pesos" required>
      <label for="due">Due date</label>
      <input id="due" type="date" required>
      <button type="submit">Save bill</button>
    </form>
  </div>

  <div class="card">
    <h2>🧾 My bills</h2>
    <ul id="bills"></ul>
  </div>
</main>

<script>
let bills = [];
try {
  bills = JSON.parse(localStorage.getItem("bayadbuddy-bills") || "[]");
} catch (e) {
  bills = [];
}

function render() {
  document.getElementById("total").textContent =
    bills.filter(b => !b.paid)
      .reduce((sum, b) => sum + b.amount, 0)
      .toLocaleString("en-PH", {
        style: "currency", currency: "PHP"
      });

  const list = document.getElementById("bills");
  list.replaceChildren();

  bills.forEach((bill, index) => {
    const item = document.createElement("li");
    const title = document.createElement("strong");
    title.textContent = bill.name + " — ₱" +
      bill.amount.toFixed(2);
    const details = document.createElement("div");
    details.textContent = "Due: " + bill.due +
      (bill.paid ? " · PAID" : " · UNPAID");
    const toggle = document.createElement("button");
    toggle.textContent = bill.paid
      ? "Mark unpaid" : "Mark paid";
    toggle.onclick = () => {
      bills[index].paid = !bills[index].paid;
      save();
    };
    const remove = document.createElement("button");
    remove.textContent = "Delete bill";
    remove.onclick = () => {
      bills.splice(index, 1);
      save();
    };
    item.append(title, details, toggle, remove);
    list.appendChild(item);
  });
}

function save() {
  localStorage.setItem("bayadbuddy-bills", JSON.stringify(bills));
  render();
}

document.getElementById("form").addEventListener("submit", event => {
  event.preventDefault();
  bills.push({
    name: document.getElementById("name").value.trim(),
    amount: Number(document.getElementById("amount").value),
    due: document.getElementById("due").value,
    paid: false
  });
  save();
  event.target.reset();
});

render();
</script>

<button id="exportBillsBtn" type="button">Export Bills (Backup)</button>

<script>
document.getElementById("exportBillsBtn").addEventListener("click", function () {
  const bills = localStorage.getItem("bayadbuddy-bills");

  if (!bills) {
    alert("Walang bill data na makikita para i-backup.");
    return;
  }

  const blob = new Blob([bills], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "bayadbuddy-bills-backup.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
